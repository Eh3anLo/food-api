openapi: 3.0.3
info:
  title: Food Ordering API
  version: 1.0.0
  description: REST API for Restaurant Online Ordering System
servers:
  - url: http://localhost:3000
    description: Local Development
tags:
  - name: Authentication
    description: Authentication endpoints
  - name: Menu
    description: Menu management
  - name: Orders
    description: Order management
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Confilct (Email registerd already)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterError409'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError401'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError404'
  /menu:
    get:
      tags:
        - Menu
      summary: Get all menu items
      description: Returns all available menu items.
      security: []
      responses:
        '200':
          description: Menu retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllMenuItemsResponse'
    post:
      tags:
        - Menu
      summary: Create menu item
      description: Create a new menu item. Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuRequest'
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Validation error
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '409':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem409'
  /menu/{id}:
    get:
      tags:
        - Menu
      summary: Get menu item
      description: Returns a single menu item.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Menu item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemByIdResponse'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
    put:
      tags:
        - Menu
      summary: Update menu item
      description: Update menu item information. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuRequest'
      responses:
        '200':
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
    delete:
      tags:
        - Menu
      summary: Delete menu item
      description: Delete a menu item. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Menu item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDeletetionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
  /orders:
    get:
      tags:
        - Orders
      summary: Get user orders
      description: |
        Returns all orders.

        - USER → only their own orders
        - ADMIN → all orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Unauthorized
    post:
      tags:
        - Orders
      summary: Create order
      description: Create a new order.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order details
      description: |
        Returns order details.

        USER can access only their own orders.
        ADMIN can access every order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order found
        '401':
          description: Unauthorized
        '404':
          description: Order not found
  /orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      description: Update order status. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - CONFIRMED
                    - PREPARING
                    - DELIVERED
                    - CANCELLED
      responses:
        '200':
          description: Order updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Unauthorized
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Ali
        email:
          type: string
          example: ali@gmail.com
        password:
          type: string
          example: 12345678
        role:
          type: string
          enum:
            - USER
            - ADMIN
    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1Ni....
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: admin@gmail.com
        password:
          type: string
          example: 12345678
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            token:
              type: string
              example: efskd2casd2....
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        category:
          type: string
        isAvailable:
          type: boolean
    CreateMenuRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        category:
          type: string
        isAvailable:
          type: boolean
    UpdateMenuRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        category:
          type: string
        isAvailable:
          type: boolean
    OrderResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              menuItemId:
                type: integer
              quantity:
                type: integer
    RegisterError409:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: حساب کاربری با این ایمیل وجود دارد
    LoginError401:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: ایمیل یا رمز عبور صحیح نمی باشد
    LoginError404:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: کاربر یافت نشد
    AllMenuItemsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: پیتزا مارگاریتا
              description:
                type: string
                example: پیتزا مارگاریتا با پنیر موتزارلا و سس گوجه
              price:
                type: integer
                example: 30000
              category:
                type: string
                example: عذای اصلی
              isAvailable:
                type: boolean
                example: true
              created_at:
                type: string
                example: '2026-06-23T20:16:58.647Z'
    ErrorResponse403:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: شما دسترسی به این بخش ندارید
    MenuItem409:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: این آیتم قبلا ثبت شده است
    MenuItemByIdResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            menuItem:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: پیتزا مارگاریتا
                description:
                  type: string
                  example: پیتزا مارگاریتا با پنیر موتزارلا و سس گوجه
                price:
                  type: integer
                  example: 30000
                category:
                  type: string
                  example: عذای اصلی
                isAvailable:
                  type: boolean
                  example: true
                created_at:
                  type: string
                  example: '2026-06-23T20:16:58.647Z'
    ErrorResponse404:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: آیتم یافت نشد
    ErrorResponse401:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: باید وارد شوید
    MenuItemDeletetionResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            menuItem:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: پیتزا مارگاریتا
                description:
                  type: string
                  example: پیتزا مارگاریتا با پنیر موتزارلا و سس گوجه
                price:
                  type: integer
                  example: 30000
                category:
                  type: string
                  example: عذای اصلی
                isAvailable:
                  type: boolean
                  example: true
                created_at:
                  type: string
                  example: '2026-06-23T20:16:58.647Z'
