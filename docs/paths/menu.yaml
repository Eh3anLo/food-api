menu:
  get:
    tags:
      - Menu

    summary: Get all menu items

    description: Returns all available menu items.

    security: []

    responses:
      "200":
        description: Menu retrieved successfully

        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/AllMenuItemsResponse"

  post:
    tags:
      - Menu

    summary: Create menu item

    description: Create a new menu item. Admin only.

    security:
      - bearerAuth: []

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/CreateMenuRequest"

    responses:
      "201":
        description: Menu item created

        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/MenuItem"

      "400":
        description: Validation error

      "403":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"

      "409":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/MenuItem409"

menuById:
  get:
    tags:
      - Menu

    summary: Get menu item

    description: Returns a single menu item.

    security: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    responses:
      "200":
        description: Menu item found

        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/MenuItemByIdResponse"

      "404":
        description: Menu item not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse404"

  put:
    tags:
      - Menu

    summary: Update menu item

    description: Update menu item information. Admin only.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/menu.yaml#/UpdateMenuRequest"

    responses:
      "200":
        description: Menu item updated

        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/MenuItem"

      "404":
        description: Menu item not found

        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse404"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse401"

      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"

  delete:
    tags:
      - Menu

    summary: Delete menu item

    description: Delete a menu item. Admin only.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    responses:
      "200":
        description: Menu item deleted

        content:
          application/json:
            schema:
              $ref: "../schemas/menu.yaml#/MenuItemDeletetionResponse"

      "404":
        description: Menu item not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse404"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse401"

      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"
