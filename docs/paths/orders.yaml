orders:

  get:
    tags:
      - Orders

    summary: Get user orders

    description: |
      Returns all orders.

      - USER → only their own orders
      - ADMIN → all orders

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Orders retrieved successfully

      "401":
        description: Unauthorized


  post:
    tags:
      - Orders

    summary: Create order

    description: Create a new order.

    security:
      - bearerAuth: []

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/order.yaml#/CreateOrderRequest"

    responses:
      "201":
        description: Order created

      "400":
        description: Invalid request

      "401":
        description: Unauthorized


orderById:

  get:
    tags:
      - Orders

    summary: Get order details

    description: |
      Returns order details.

      USER can access only their own orders.
      ADMIN can access every order.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    responses:
      "200":
        description: Order found

      "404":
        description: Order not found

      "401":
        description: Unauthorized


updateStatus:

  patch:
    tags:
      - Orders

    summary: Update order status

    description: Update order status. Admin only.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    requestBody:
      required: true

      content:
        application/json:
          schema:
            type: object

            properties:

              status:
                type: string

                enum:
                  - PENDING
                  - CONFIRMED
                  - PREPARING
                  - DELIVERED
                  - CANCELLED

    responses:
      "200":
        description: Order updated

      "404":
        description: Order not found

      "401":
        description: Unauthorized

      "403":
        description: Forbidden