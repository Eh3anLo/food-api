orders:
  get:
    tags:
      - Orders

    summary: Get all orders

    description: |
      Returns all orders.

      - ADMIN → all orders

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Orders retrieved successfully

        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/AllOrderResponse"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse401"

      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"

  post:
    tags:
      - Orders

    summary: Create order

    description: Create a new order.

    security:
      - bearerAuth: []

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../schemas/order.yaml#/CreateOrderRequest"

    responses:
      "201":
        description: Order created

        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/CreateOrderResponse"

      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse400"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"

orderById:
  get:
    tags:
      - Orders

    summary: Get order details

    description: |
      Returns order details.

      - USER can access only their own orders.
      - ADMIN can access every order.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    responses:
      "200":
        description: Order found
        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/OrderByIdResponse"

      "404":
        description: Order not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse404"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse401"

      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"

updateStatus:
  patch:
    tags:
      - Orders

    summary: Update order status

    description: Update order status. **Admin only**.

    security:
      - bearerAuth: []

    parameters:
      - name: id
        in: path
        required: true

        schema:
          type: integer

    requestBody:
      required: true

      content:
        application/json:
          schema:
            type: object

            properties:
              status:
                type: string

                enum:
                  - PENDING
                  - CONFIRMED
                  - PREPARING
                  - DELIVERED
                  - CANCELLED

    responses:
      "200":
        description: Order updated
        content:
          application/json:
            schema:
              $ref: "../schemas/order.yaml#/OrderUpdateStateResponse"

      "404":
        description: Order not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse404"

      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse401"

      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse403"
