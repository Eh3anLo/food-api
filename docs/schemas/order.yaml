OrderUpdateStateResponse:
  type: object
  properties:
    status:
      type: string
      example: success
    data:
      type: object
      properties:
        order_id:
          type: integer
          example: 46
        total_price:
          type: integer
          format: int64
          example: 6150000
        status:
          type: string
          example: CONFIRMED
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
            - COMPLETED
